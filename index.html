<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ KING 👑</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;
    background:linear-gradient(135deg,#07111f,#172554,#1d4ed8);
}

.app{
    width:94%;
    max-width:620px;
    margin:auto;
    padding:18px 0;
}

.card{
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.16);
    border-radius:24px;
    padding:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.hidden{display:none!important}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:900;
    margin:8px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin:10px 0 20px;
}

button,input{
    font:inherit;
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    margin:6px 0;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

.primary{
    background:#facc15;
    color:#111827;
}

.lang{
    background:transparent;
    color:white;
    border:1px solid #64748b;
}

.category{
    background:rgba(255,255,255,.10);
    color:white;
    border:1px solid rgba(255,255,255,.18);
}

.category.selected{
    outline:3px solid #facc15;
}

.category-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
}

.top{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:12px;
}

.progress{
    height:8px;
    background:rgba(255,255,255,.15);
    border-radius:10px;
    overflow:hidden;
}

.progress div{
    height:100%;
    width:0;
    background:#facc15;
}

.question{
    font-size:22px;
    font-weight:800;
    line-height:1.5;
    margin:18px 0;
}

.answers button{
    background:white;
    color:#111827;
}

.answers button.correct{
    background:#22c55e;
    color:white;
}

.answers button.wrong{
    background:#ef4444;
    color:white;
}

.hint{
    background:#38bdf8;
    color:#082f49;
}

.voice{
    background:#a78bfa;
    color:#24104f;
}

.message{
    min-height:28px;
    text-align:center;
    color:#fde68a;
    margin-top:8px;
}

.visual{
    text-align:center;
    font-size:90px;
    padding:15px;
    margin-top:15px;
    border-radius:20px;
    background:rgba(0,0,0,.25);
}

.typing{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    margin:6px 0;
    outline:none;
}

.result{
    text-align:center;
}

.trophy{
    font-size:75px;
}

.small{
    color:#cbd5e1;
    font-size:13px;
}

@media(max-width:430px){
    .category-grid{
        grid-template-columns:1fr;
    }

    .question{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<section id="home" class="card">

<div class="logo">👑 QUIZ KING</div>

<div id="subtitle" class="subtitle">
تحدَّ نفسك وأثبت أنك ملك المعلومات!
</div>

<button id="languageButton" class="lang" onclick="changeLanguage()">
العربية / Français / English
</button>

<h3 id="chooseCategory">
اختر المجال
</h3>

<div id="categories" class="category-grid"></div>

<button id="startButton" class="primary" onclick="startGame()">
ابدأ اللعب 🚀
</button>

</section>


<!-- GAME -->

<section id="game" class="card hidden">

<div class="top">

<span>
⭐ <span id="score">0</span>
</span>

<span>
⏱️ <span id="timer">20</span>
</span>

<span>
❓ <span id="questionNumber">1</span>
</span>

</div>

<div class="progress">
<div id="progressBar"></div>
</div>

<div id="visual" class="visual hidden"></div>

<div id="question" class="question"></div>

<div id="answers" class="answers"></div>

<div id="typingArea" class="hidden">

<input
id="typedAnswer"
class="typing"
type="text"
autocomplete="off"
placeholder="اكتب إجابتك هنا"
>

<button
id="sendButton"
onclick="submitTypedAnswer()">
إرسال ✍️
</button>

</div>

<button
id="voiceButton"
class="voice"
onclick="voiceAnswer()">
🎤 أجب بالصوت
</button>

<button
id="hintButton"
class="hint"
onclick="useHint()">
💡 تلميح (-15 نقطة)
</button>

<div id="message" class="message"></div>

</section>


<!-- RESULT -->

<section id="result" class="card result hidden">

<div class="trophy">🏆</div>

<h2 id="finished">
انتهت المسابقة!
</h2>

<h1>
⭐ <span id="finalScore">0</span>
</h1>

<p id="resultText"></p>

<button
id="againButton"
class="primary"
onclick="restart()">
🔄 العب مرة أخرى
</button>

</section>

</div>

let timerId=null;

let hintUsed=false;


/* =========================
   CATEGORY DISPLAY
========================= */

function renderCategories(){

const box=document.getElementById("categories");

box.innerHTML="";

categoryKeys.forEach((key,index)=>{

const button=document.createElement("button");

button.className="category";

if(selectedCategory===key){
button.classList.add("selected");
}

button.textContent=translations[language].categories[index];

button.onclick=()=>{

selectedCategory=key;

renderCategories();

};

box.appendChild(button);

});

}


/* =========================
   LANGUAGE
========================= */

function updateLanguage(){

const t=translations[language];

document.documentElement.lang=language;

document.documentElement.dir=
language==="ar"?"rtl":"ltr";

document.getElementById("subtitle").textContent=t.subtitle;

document.getElementById("chooseCategory").textContent=t.choose;

document.getElementById("startButton").textContent=t.start;

document.getElementById("hintButton").textContent=t.hint;

document.getElementById("voiceButton").textContent=t.voice;

document.getElementById("sendButton").textContent=t.send;

document.getElementById("typedAnswer").placeholder=t.placeholder;

document.getElementById("finished").textContent=t.finished;

document.getElementById("againButton").textContent=t.again;

renderCategories();

}


/* =========================
   CHANGE LANGUAGE
========================= */

function changeLanguage(){

if(language==="ar"){
language="fr";
}
else if(language==="fr"){
language="en";
}
else{
language="ar";
}

updateLanguage();

}


/* =========================
   START GAME
========================= */

function startGame(){

if(selectedCategory==="all"){

gameQuestions=[...questions];

}
else{

gameQuestions=
questions.filter(q=>q.cat===selectedCategory);

}

gameQuestions.sort(()=>Math.random()-0.5);

current=0;
score=0;

document.getElementById("home")
.classList.add("hidden");

document.getElementById("result")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");

showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

clearInterval(timerId);

if(current>=gameQuestions.length){

finishGame();

return;

}

hintUsed=false;

timer=20;

document.getElementById("score").textContent=score;

document.getElementById("timer").textContent=timer;

document.getElementById("questionNumber").textContent=
(current+1)+" / "+gameQuestions.length;

document.getElementById("progressBar").style.width=
((current/gameQuestions.length)*100)+"%";

document.getElementById("message").textContent="";

const q=gameQuestions[current];

document.getElementById("question").textContent=
q.q[language];


/* IMAGE */

const visual=document.getElementById("visual");

if(q.cat==="image"){

visual.textContent=q.visual;

visual.classList.remove("hidden");

}
else{

visual.classList.add("hidden");

}


/* ANSWERS */

const answers=document.getElementById("answers");

answers.innerHTML="";

q.a.forEach((answer,index)=>{

const button=document.createElement("button");

button.textContent=answer;

button.onclick=()=>answerQuestion(index);

answers.appendChild(button);

});


/* TYPING */

document.getElementById("typingArea")
.classList.add("hidden");

document.getElementById("typedAnswer").value="";


/* TIMER */

timerId=setInterval(()=>{

timer--;

document.getElementById("timer").textContent=timer;

if(timer<=0){

clearInterval(timerId);

document.getElementById("message").textContent=
translations[language].time;

setTimeout(()=>{

current++;

showQuestion();

},700);

}

},1000);

}


/* ========
*/

let answered = false;
let correctCount = 0;

/* ANSWER QUESTION */

function answerQuestion(index) {
    if (answered) return;

    answered = true;
    clearInterval(timerId);

    const q = gameQuestions[current];
    const buttons = document.getElementById("answers").children;
    const t = translations[language];

    for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;

        if (i === q.correct) {
            buttons[i].classList.add("correct");
        }
    }

    if (index === q.correct) {
        score += 10;
        correctCount++;
        document.getElementById("message").textContent = t.correct;
    } else {
        buttons[index].classList.add("wrong");
        document.getElementById("message").textContent = t.wrong;
    }

    document.getElementById("score").textContent = score;

    setTimeout(() => {
        current++;
        showQuestion();
    }, 1100);
}

/* HINT */

function useHint() {
    if (answered) return;

    const t = translations[language];

    if (hintUsed) {
        document.getElementById("message").textContent =
            language === "ar" ? "استخدمت التلميح بالفعل!" :
            language === "fr" ? "Indice déjà utilisé !" :
            "Hint already used!";
        return;
    }

    if (score < 15) {
        document.getElementById("message").textContent = t.need;
        return;
    }

    score -= 15;
    hintUsed = true;

    const q = gameQuestions[current];
    const buttons = document.getElementById("answers").children;

    let removed = 0;

    for (let i = 0; i < buttons.length; i++) {
        if (i !== q.correct && removed < 2) {
            buttons[i].disabled = true;
            buttons[i].style.visibility = "hidden";
            removed++;
        }
    }

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent = t.used;
}

/* TYPED ANSWER */

function submitTypedAnswer() {
    if (answered) return;

    const input = document.getElementById("typedAnswer");
    const value = input.value.trim().toLowerCase();

    if (!value) {
        document.getElementById("message").textContent =
            language === "ar" ? "اكتب إجابتك أولًا." :
            language === "fr" ? "Écrivez d'abord votre réponse." :
            "Type your answer first.";
        return;
    }

    const q = gameQuestions[current];
    const correctAnswer = q.a[q.correct].trim().toLowerCase();

    if (value === correctAnswer) {
        answerQuestion(q.correct);
    } else {
        let found = -1;

        for (let i = 0; i < q.a.length; i++) {
            if (value === q.a[i].trim().toLowerCase()) {
                found = i;
                break;
            }
        }

        answerQuestion(found === -1 ? -1 : found);
    }
}

/* VOICE ANSWER */

function voiceAnswer() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        document.getElementById("message").textContent =
            language === "ar"
                ? "المتصفح لا يدعم الإجابة الصوتية. جرّب Chrome."
                : language === "fr"
                ? "La reconnaissance vocale n'est pas prise en charge."
                : "Voice recognition is not supported in this browser.";
        return;
    }

    if (answered) return;

    const recognition = new SpeechRecognition();

    recognition.lang =
        language === "ar" ? "ar-DZ" :
        language === "fr" ? "fr-FR" : "en-US";

    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    document.getElementById("message").textContent =
        language === "ar" ? "🎤 استمع إليك الآن..." :
        language === "fr" ? "🎤 Je vous écoute..." :
        "🎤 Listening...";

    recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript
            .trim()
            .toLowerCase();

        const q = gameQuestions[current];

        let found = -1;

        for (let i = 0; i < q.a.length; i++) {
            if (spoken === q.a[i].trim().toLowerCase()) {
                found = i;
                break;
            }
        }

        if (found !== -1) {
            answerQuestion(found);
        } else {
            document.getElementById("message").textContent =
                language === "ar"
                    ? "لم أتعرف على الإجابة. حاول اختيارها من القائمة."
                    : language === "fr"
                    ? "Réponse non reconnue. Choisissez dans la liste."
                    : "Answer not recognized. Choose from the list.";
        }
    };

    recognition.onerror = function() {
        document.getElementById("message").textContent =
            language === "ar"
                ? "تعذر التعرف على الصوت. تحقق من إذن الميكروفون."
                : language === "fr"
                ? "Erreur du microphone. Vérifiez les autorisations."
                : "Voice error. Check microphone permissions.";
    };

    recognition.start();
}

/* FINISH GAME */

function finishGame() {
    clearInterval(timerId);

    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("finalScore").textContent = score;

    const percentage = gameQuestions.length
        ? Math.round((correctCount / gameQuestions.length) * 100)
        : 0;

    document.getElementById("resultText").textContent =
        translations[language].result
            .replace("{p}", percentage)
            .replace("{s}", score);
}

/* RESTART */

function restart() {
    clearInterval(timerId);

    document.getElementById("result").classList.add("hidden");
    document.getElementById("game").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");

    selectedCategory = "all";
    renderCategories();
}

/* INITIALIZE APP */

updateLanguage();</script>
</body>
</html>
