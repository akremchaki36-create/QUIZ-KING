<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10172a">
<title>QUIZ KING</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#0b1020;color:#fff;min-height:100vh}
header{text-align:center;padding:20px 10px}
h1{color:#ffc857;margin:0;font-size:30px}
header p{color:#bbc6df}
main{max-width:750px;margin:auto;padding:12px}
.panel{background:#151e34;border:1px solid #344466;border-radius:18px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,button{font:inherit;border:0;border-radius:11px;padding:12px;cursor:pointer}
select{background:#263653;color:white}
.stats{background:#263653;padding:10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.game{background:#263653;color:white;text-align:start;border:1px solid #405477;min-height:85px}
.game span{display:block;font-size:23px;margin-bottom:6px}
.game small{display:block;color:#bbc6df;margin-top:5px}
.hidden{display:none!important}
button:active{transform:scale(.98)}
.answers{display:grid;gap:9px;margin:15px 0}
.answer{background:#263653;color:white;text-align:start;border:1px solid #405477}
.answer.correct{background:#176548}
.answer.wrong{background:#783344}
.answer:disabled{opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.primary{background:#4c8dff;color:white}
.gold{background:#ffc857;color:#151e34}
.secondary{background:#344466;color:white}
.question{font-size:20px;line-height:1.6;margin:18px 0}
.question img{display:block;width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin-bottom:12px}
.feedback{color:#ffc857;min-height:26px;line-height:1.5}
.progress{height:7px;background:#344466;border-radius:8px;overflow:hidden;margin:12px 0}
.progress div{height:100%;width:0;background:#37d69a}
#memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memory-card{background:#263653;color:white;font-size:25px;min-height:65px}
#tttGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:350px;margin:15px auto}
.cell{background:#263653;color:white;font-size:35px;min-height:75px}
footer{text-align:center;color:#8998b8;padding:15px;font-size:12px}
@media(max-width:380px){.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<header>
<h1>👑 QUIZ KING</h1>
<p id="tagline">اختبر ذكاءك واجمع النقاط!</p>
</header>

<main>
<div class="top">
<select id="language" aria-label="Language">
<option value="ar">العربية</option>
<option value="fr">Français</option>
<option value="en">English</option>
</select>
<div class="stats"><span id="pointsLabel">النقاط</span>: <b id="points">0</b></div>
</div>

<section id="home" class="panel">
<h2 id="welcome">اختر لعبة</h2>
<p id="intro">الإجابة الصحيحة = 10 نقاط، والتلميح يكلف 3 نقاط.</p>
<div class="grid">
<button class="game" data-game="general"><span>🧠</span><b data-t="general">ثقافة عامة</b><small data-t="generalSub">أسئلة متنوعة</small></button>
<button class="game" data-game="football"><span>⚽</span><b data-t="football">كرة القدم</b><small data-t="footballSub">لاعبون وأندية</small></button>
<button class="game" data-game="movies"><span>🎬</span><b data-t="movies">الأفلام والممثلون</b><small data-t="moviesSub">أسئلة عن النجوم</small></button>
<button class="game" data-game="flags"><span>🌍</span><b data-t="flags">أعلام الدول</b><small data-t="flagsSub">اكتشف الدولة</small></button>
<button class="game" data-game="landmarks"><span>🏛️</span><b data-t="landmarks">معالم العالم</b><small data-t="landmarksSub">أماكن مشهورة</small></button>
<button class="game" data-game="cars"><span>🚘</span><b data-t="cars">السيارات</b><small data-t="carsSub">ماركات ومعلومات</small></button>
<button class="game" data-game="who"><span>🕵️</span><b data-t="who">من أنا؟</b><small data-t="whoSub">اكتشف الشخصية</small></button>
<button class="game" data-game="memory"><span>🧩</span><b data-t="memory">لعبة الذاكرة</b><small data-t="memorySub">اعثر على الأزواج</small></button>
<button class="game" data-game="ttt"><span>⭕</span><b data-t="ttt">إكس-أو</b><small data-t="tttSub">ضد الكمبيوتر</small></button>
</div>
</section>

<section id="quiz" class="panel hidden">
<div class="top">
<b id="category"></b>
<span><span id="timeLabel">الوقت</span>: <b id="timer">20</b></span>
<span id="counter"></span>
</div>
<div class="progress"><div id="bar"></div></div>
<div id="question" class="question"></div>
<div id="answers" class="answers"></div>
<p id="feedback" class="feedback"></p>
<div class="row">
<button id="hint" class="gold">💡 تلميح (-3)</button>
<button id="skip" class="secondary">تخطَّ</button>
<button id="quizHome" class="secondary">الرئيسية</button>
</div>
</section>

<section id="result" class="panel hidden">
<h2 id="resultTitle">انتهت الجولة!</h2>
<p id="resultText"></p>
<div class="row">
<button id="again" class="primary">العب مجددًا</button>
<button id="resultHome" class="secondary">الرئيسية</button>
</div>
</section>

<section id="memory" class="panel hidden">
<h2 data-t="memory">لعبة الذاكرة</h2>
<p id="memoryHelp">اعثر على البطاقات المتطابقة.</p>
<div id="memoryGrid"></div>
<p id="memoryStatus" class="feedback"></p>
<div class="row">
<button id="memoryAgain" class="primary">إعادة اللعب</button>
<button id="memoryHome" class="secondary">الرئيسية</button>
</div>
</section>

<section id="ttt" class="panel hidden">
<h2 data-t="ttt">إكس-أو</h2>
<p id="tttStatus"></p>
<div id="tttGrid"></div>
<div class="row">
<button id="tttAgain" class="primary">إعادة اللعب</button>
<button id="tttHome" class="secondary">الرئيسية</button>
</div>
</section>
<footer>QUIZ KING</footer>
</main>
